# 架构图产物检查：确保 docs/diagrams 下的图纸 JSON 仍能生成结构完整的 draw.io 文件。
# 为什么需要：draw.io 文件是人工长期维护的入口，如果 JSON 改动后忘记重新生成，
# 或者脚本本身被改坏，边会指向不存在的顶点，这里可以在 PR 阶段直接拦住。
name: Diagrams Check

# 只在 PR 上跑：main 已被分支规则集「main」锁死（必须走 PR、禁 force push、禁删除，
# bypass 为空），不可能有绕过 PR 检查的内容落到 main，push 上再跑一遍是纯冗余。
# 保留 paths 过滤是为了在没动图纸的 PR 上跳过本检查（也因此它不宜设为必需检查：
# 不触发就永远 pending，会把 PR 卡死）。需要时用 workflow_dispatch 手动触发。
on:
  pull_request:
    paths:
      - 'docs/diagrams/**'
      - '.github/workflows/diagrams-check.yml'
  workflow_dispatch:

jobs:
  drawio-check:
    name: 图纸 JSON → draw.io 校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # docs/diagrams 下的 PNG 已由 Git LFS 托管，必须拉取真实内容再比对
          lfs: true

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 重新生成并校验 .drawio
        run: python docs/diagrams/spec-to-drawio.py docs/diagrams

      - name: 确认生成结果已提交（无未跟踪改动）
        run: git diff --exit-code -- docs/diagrams
