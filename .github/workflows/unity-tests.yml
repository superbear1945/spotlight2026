# PR 测试流水线：在 GitHub Action 中按“这次改了什么”决定跑哪套 Unity 测试。
#
# 为什么需要分层：每个 PR 都恒定跑 EditMode + PlayMode 要 8 分钟 + 两轮 Unity 个人版授权席位，
# 而“只改了一份文档”的 PR 跑这两套没有任何信息量。分层后：
#   文档层（docs/**、*.md、AGENTS.md…）      → 两套都跳过，只留大文件/LFS 检查（约 1 分钟）
#   表现层（Runtime/UI|View|Feedback、uxml/uss、场景…） → 只跑 PlayMode
#   规则层 / 交叉层（Core、Generated、Config、Editor、卡片视图、.meta、工程设置…） → 两套都跑
# 判定由 scripts/classify-change-set.sh 负责（带 --self-test，repo-hygiene.yml 每次 PR 都会跑它）。
# 分层口径与理由见 docs/tasks/completed/CI测试分层计划.md。
#
# ⚠️ 为什么不用 workflow 级 `paths:` 过滤（看起来更简单）：
#   三条必需检查是分支规则集「main」按字符串精确匹配的。workflow 因 paths 过滤没触发时，
#   对应检查会永久停在 Pending，PR 直接锁死（官方文档 "Skipping workflow runs" 明写了这一点）。
#   所以本文件绝不能出现 `on.pull_request.paths`：那不是优化，是把自己锁死。
#   “这次不跑”只能表现为 job 级跳过——官方文档（Status checks）：
#   "A job that is skipped will report its status as 'Success'. It will not prevent a pull
#   request from merging, even if it is a required check."，PR 上显示为灰色 Skipped。
#
# ⚠️ 为什么两个测试 job 是两个字面名 job 而不是原来的 matrix：
#   job 级 `if` 读不到 matrix 上下文（只支持 github/needs/vars/inputs），
#   要“真跳过”（Skipped，而不是 job 跑起来再把步骤跳掉）就必须把矩阵拆开。
#   job 名被 ruleset 按字符串精确引用，改名必须同步改规则集，否则所有 PR 永久 pending。
#
name: Unity Tests

# 只在 PR 上跑，不在 main 的 push 上重复跑。
# 为什么可以这样：分支规则集「main」已同时开启 required_status_checks（strict=true）、
# pull_request（必须走 PR）、non_fast_forward（禁 force push）、deletion（禁删分支），
# 且 bypass_actors 为空、current_user_can_bypass=never —— main 上不可能出现绕过 PR 的内容。
# 而 strict 模式要求 PR 分支必须先与 main 同步，于是 PR 阶段被测的 merge 结果
# 就是合并后落到 main 的那个 commit（实测两者为同一 SHA），push 再跑一遍是 100% 冗余。
# 需要临时验证或强制跑两套全量时，用 workflow_dispatch 手动触发：
# 它没有 PR 的 base/head，分类器会按 fail-safe 规则两套都跑。
on:
  pull_request:
  workflow_dispatch:

# 全仓库共用一个组名：Unity 个人版授权是账号级“席位”，同一时刻只能有一个 Unity 进程。
# 为什么不再按 ref 分组（原来写的是 unity-tests-${{ github.ref }}）：不同 ref 落在不同组里，
# 两个 PR（refs/pull/N/merge 各不相同）可能同时启动，各自 --activate-all 抢同一个席位，
# 输的一方拿到 “0 free entitlements” 而整轮假失败。改成固定组名后，仓库内任意两个
# Unity 运行都会自动排队。
# 代价（必须清楚）：GitHub 的并发组只留 1 个 running + 1 个 pending，新排队的运行会
# *取消掉更早的那个排队中的运行*——于是某个 PR 可能看到检查直接变成 cancelled，重跑即可。
# 刻意不设 cancel-in-progress：个人版授权是“席位”制，中途取消正在运行的 job 可能来不及归还席位
# （CLI 只在 EXIT trap 能执行完时归还），泄漏的席位会让该账号之后所有运行报 no available seats。
concurrency:
  # 必须是固定名（不含任何变量）：scripts/check-ci-config.sh 会拦住按 ref 分组的写法。
  group: unity-seat

# 为什么需要显式声明权限：仓库默认的 Workflow permissions 是「只读」，
# 而 unity-test-runner 会用 githubToken 创建 check run 来汇报测试结果（对应下面的 checkName），
# 权限不足时会直接以 ##[error]Resource not accessible by integration 让整个 job 失败，
# 表现为“测试全部通过、job 却是红的”这种假失败（PlayMode 4/4 Passed 仍失败即此原因）。
# pull-requests: write 是给 classify job 发/更新“本次跑了什么”的分类评论用的。
# 只声明所需的最小集合，避免把仓库全局默认改成读写。
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ===========================================================================
  # 变更分类：永远运行，唯一负责“这次该跑哪套”的判定与说明
  # 为什么单独一个 job：被跳过的 job 没有步骤可执行，写不了任何说明；
  # 而“为什么这套没跑”必须留在某个永远运行的地方（运行摘要 + PR 评论）。
  # ===========================================================================
  classify:
    # 本 job 名不是必需检查，可以自由改名。
    name: 变更分类（决定跑哪些测试）
    runs-on: ubuntu-latest
    # BASE/HEAD 放在 job 级：分类、摘要、评论三步都要用同一份 diff（不同步就会各算一份）。
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    outputs:
      edit: ${{ steps.classify.outputs.edit }}
      play: ${{ steps.classify.outputs.play }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 需要 base...head 的完整历史才能算 diff；分类不读任何资产，故不拉 LFS 实体。
          fetch-depth: 0
          lfs: false

      - name: 判定本次变更属于哪一层
        id: classify
        # PR 事件才有 BASE/HEAD；workflow_dispatch 为空 → 分类器按 fail-safe 两套都跑。
        run: bash scripts/classify-change-set.sh >> "$GITHUB_OUTPUT"

      - name: 写入运行摘要
        if: always()
        run: bash scripts/classify-change-set.sh --summary >> "$GITHUB_STEP_SUMMARY"

      - name: 在 PR 对话里更新分类结论
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 评论只是辅助信息：fork PR 的 GITHUB_TOKEN 是只读的、发帖会失败，
        # 不能让“发不出评论”把整个流水线弄红（结论同时在运行摘要与 Skipped 状态里）。
        run: bash scripts/classify-change-set.sh --comment || true

  # ===========================================================================
  # EditMode：规则内核、配置编译器与视图契约
  # ===========================================================================
  editmode-tests:
    # ⚠️ 本 job 名被分支规则集「main」的必需检查（required_status_checks）按字符串精确引用，
    # 改名必须同步修改 ruleset，否则所有 PR 会永久停在 pending 且没有任何报错提示。
    name: EditMode 测试（Unity 2022.3.62f3）
    needs: classify
    # 分类 job 失败/无输出时也照跑（宁可多花 4 分钟，也不能“分类器坏了还显示通过”）。
    if: always() && (needs.classify.result != 'success' || needs.classify.outputs.edit == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 缓存 Library
        # 这里刻意保持 actions/cache@v4（而不用 restore/save 拆开）：实测把两个 job 拆成
        # restore 两个都做、save 只有 EditMode 做之后，PlayMode 连续两次在
        # EnterPlayMode 阶段 SIGSEGV（exit 139）。同一版本换回本写法即可通过，
        # 在查清原因之前先用这个稳妥的写法。
        # 另：拆开也并不能减少缓存占用——缓存按 ref 隔离，不同 ref 本来就各存一份。
        uses: actions/cache@v4
        with:
          path: Library
          # Library 与编辑器版本强绑定，缓存键必须带版本号：跨版本复用会出现
          # 无法解释的重导入与偶发失败。
          key: Library-2022.3.62f3-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-2022.3.62f3-

      - name: 运行测试
        # 为什么固定到 v4.4.0：@v4 会跟随上游发布，而 v4.4.0 起该 action 已改成
        # game-ci/cli 的 thin wrapper，授权实现与旧版完全不同；固定版本才能在出问题时定位，
        # 也避免上游再次发生 #309 那种“同一个大版本内行为改变”的回归。升级前请先在 PR 上验证授权与测试都跑通。
        uses: game-ci/unity-test-runner@v4.4.0
        env:
          # 为什么不再提供 UNITY_LICENSE：Unity 已取消个人版（Personal）的离线手工激活，
          # .ulf 里的 MachineBindings 会把它绑死到申请它的那台机器上；hosted runner 每次都是新机器，
          # 直接加载该文件必然失败（日志表现为 Code 400 TimeStamp validation failed /
          # No ULF license found, Token not found in cache），而 CLI v0.1.72 的永久失败兜底只识别
          # "Machine bindings don't match" 这一种措辞，不会自动回退到账号激活，只会白重试 5 次（约 5 分钟）后退出。
          # 只给账号密码时，激活方式按 file → serial → floating → personal 解析为 personal，
          # CLI 会用 Unity.Licensing.Client --activate-all --include-personal 直接认领一个个人席位，与机器无关。
          # 注意：该账号不能依赖 2FA/设备验证（headless 无法应答），建议使用专用的 CI 账号。
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # 为什么还要一个 GITHUB_TOKEN 环境变量（它和下面的 githubToken 输入不是一回事）：
          # unity-test-runner v4.4.0 在解析 CLI 版本时会请求 GitHub Releases API，而该请求只读
          # process.env.GITHUB_TOKEN / GH_TOKEN（见 action 的 src/download-cli.ts）。
          # 匿名请求受共享 runner IP 的 60 次/小时限额约束，会被别的仓库流量打成 403，
          # 表现为 “Failed to resolve the latest game-ci CLI release: GitHub API returned 403.”（2026-10-11 09:41 那次失败）。
          # 注入后限额升到 5000 次/小时；配合下面固定 cliVersion，这一层只是双保险。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          unityVersion: '2022.3.62f3'
          # 为什么固定 CLI 版本而不是用默认的 latest：latest 要先调 GitHub Releases API 把版本解析成 tag，
          # 那次匿名调用被限流就会 403，整个 job 在 25 秒内直接失败（Unity 都没启动、没有 artifacts，
          # 看起来像测试挂了，其实一步都没跑）。固定成具体 tag 后既不请求该 API，也让每次运行用的 CLI 可复现。
          # 升级前先在本 PR 上验证授权与测试都跑通（当前 game-ci/cli 最新为 v0.1.72，2026-10-03 发布）。
          cliVersion: v0.1.72
          testMode: EditMode
          # 为什么只跑本项目自己的测试（命名空间 Spotlight.Tests）：
          # Packages/manifest.json 里以 git 地址引入的第三方包 com.besty.unity-skills 自带 1600+ 个
          # Editor 测试，其中 PerceptionSkillsTests.SceneSummarize_CountsObjectsCorrectly 依赖
          # 批处理模式下不存在的默认场景对象（Camera/Light）而必然断言失败，
          # 会把与本项目无关的红灯带到每个 PR 上（也白白多花几分钟）。
          # 注意：unity-test-runner v4.4.0 已不再暴露 testFilter 输入，
          # 只能用 customParameters 追加 Unity CLI 原生的 -testFilter 参数。
          customParameters: -testFilter Spotlight.Tests
          artifactsPath: test-results-EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode 测试结果

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-EditMode
          path: test-results-EditMode

  # ===========================================================================
  # PlayMode：真实帧循环下的表现与交互（以及主流程冒烟）
  # ===========================================================================
  playmode-tests:
    # ⚠️ 同上：本 job 名被 ruleset 的必需检查按字符串精确引用，改名必须同步改 ruleset。
    name: PlayMode 测试（Unity 2022.3.62f3）
    # needs 链同时承担两件事：等待分类结论、保证两套 Unity 不会同时启动抢授权席位
    # （矩阵拆开后不再有 max-parallel: 1，串行只能靠依赖关系表达；守卫会检查这条）。
    needs: [classify, editmode-tests]
    if: always() && (needs.classify.result != 'success' || needs.classify.outputs.play == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 缓存 Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-2022.3.62f3-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-2022.3.62f3-

      - name: 运行测试
        uses: game-ci/unity-test-runner@v4.4.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          unityVersion: '2022.3.62f3'
          cliVersion: v0.1.72
          testMode: PlayMode
          customParameters: -testFilter Spotlight.Tests
          artifactsPath: test-results-PlayMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: PlayMode 测试结果

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-PlayMode
          path: test-results-PlayMode
