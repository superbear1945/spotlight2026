# 仓库体积卫生检查：拦住"大二进制文件以普通 blob 形式入库"的提交。
#
# 为什么需要：blob 一旦进入 git 历史，之后删文件也回收不了体积（除非重写历史），
# 而 GitHub 还有 100 MB 的单文件硬上限，超了就直接推不上去。
# 一次误提交的大贴图/大视频就足以把仓库永久撑大，所以必须在 PR 阶段拦下来。
#
# 与 .gitattributes 的 Git LFS 小节配套：合规的大二进制会以约 130 字节的 LFS
# 指针入库，因此不会触碰大小阈值；未被 LFS 覆盖的类型若体积超标则直接报错。
name: Repo Hygiene

# 只在 PR 上跑：main 已被分支规则集「main」锁死（必须走 PR、禁 force push、禁删除，
# bypass 为空），不可能有绕过 PR 检查的内容落到 main，push 上再跑一遍是纯冗余。
# 需要临时在 main 上验证时，用 workflow_dispatch 手动触发。
on:
  pull_request:
  workflow_dispatch:

# 只读检查，不需要写权限
permissions:
  contents: read

jobs:
  repo-hygiene:
    # ⚠️ 本 job 名被分支规则集「main」的必需检查（required_status_checks）按字符串精确引用，
    # 改名必须同步修改 ruleset，否则所有 PR 会永久停在 pending 且没有任何报错提示。
    name: 大文件与 LFS 一致性检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 不拉取 LFS 内容：本检查只看指针文本与 blob 大小，省带宽也更快
          lfs: false

      - name: 校验检查脚本自身（隔离回归用例）
        run: bash scripts/check-repo-hygiene.sh --self-test

      - name: 校验字体 LFS 回归检查自身
        run: bash scripts/test-font-lfs.sh --self-test

      - name: 大文件与 LFS 一致性检查
        env:
          MAX_FILE_MB: '5'
        run: bash scripts/check-repo-hygiene.sh

      - name: 字体 LFS 存储回归检查
        run: bash scripts/test-font-lfs.sh

      # 与本 job 同驻的理由：都是秒级、无 Unity 依赖的仓库配置守卫。
      # 它负责拦住“加回 push 触发”“给 unity-tests 加 workflow 级 paths 过滤”“两套 Unity 改回并行抢席位”
      # 以及“测试 job 不再依赖变更分类”这类回归。
      # 注意：脚本还有一个 --check-ruleset 模式（比对 job 名与分支规则集的必需检查），
      # 需要 admin 权限、而 Actions 默认的 GITHUB_TOKEN 读不到规则集，因此不上流水线，
      # 只能本地在合并前跑：bash scripts/check-ci-config.sh --check-ruleset
      - name: CI 配置守卫（PR 入口、Unity 串行与变更分类接线）
        run: bash scripts/check-ci-config.sh

      - name: 校验 CI 配置守卫脚本自身
        run: bash scripts/check-ci-config.sh --self-test

      # 发布包体去调试化：检查 Build/ 里有没有开发期信息（调试面板文案/类型名、Excel 路径与摘要、
      # Burst 调试目录）。Build/ 不进 git，CI 上通常没有产物，真实检查会直接跳过；
      # 自检那一步保证“泄露必须被拦住”的判断逻辑一直有效（否则脚本可能静默失效）。
      # 本地打完包后执行：bash scripts/check-build-hygiene.sh
      - name: 校验发布包体卫生脚本自身
        run: bash scripts/check-build-hygiene.sh --self-test

      - name: 发布包体卫生检查（无 Build/ 产物时自动跳过）
        run: bash scripts/check-build-hygiene.sh

      # 变更分类器决定“哪个 PR 跑哪套测试”，它算错就会静默漏测一层，
      # 因此和 --self-test 一起每次 PR 都跑（分层规则或自检用例被改坏会当场红）。
      - name: 校验变更分类脚本自身
        run: bash scripts/classify-change-set.sh --self-test

