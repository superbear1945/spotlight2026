# PR 测试流水线 + 夜间打包：在 GitHub Action 中运行 Unity EditMode 与 PlayMode 测试，
# 测试全绿后再把 Windows 桌面包发布到 Release（见文件末尾的 build-windows job）。
# 为什么需要：AGENTS.md 要求每个功能都留下可在 PR 上自动执行的测试；
# 规则内核与配置编译器不依赖场景，用 EditMode 即可覆盖；
# 而棋盘渲染、点击落点与 DOTween 动效只有在真实帧循环（PlayMode）里才能验证，
# 因此两种模式都要在流水线上跑，避免“日志说移动了、界面却没动”这类问题再次漏过。
name: Unity Tests

# PR 测试只在 PR 上跑（另有手动兜底；夜间定时打包当前已暂停，见下面 on: 块），不在 main 的 push 上重复跑。
# 为什么可以这样：分支规则集「main」已同时开启 required_status_checks（strict=true）、
# pull_request（必须走 PR）、non_fast_forward（禁 force push）、deletion（禁删分支），
# 且 bypass_actors 为空、current_user_can_bypass=never —— main 上不可能出现绕过 PR 的内容。
# 而 strict 模式要求 PR 分支必须先与 main 同步，于是 PR 阶段被测的 merge 结果
# 就是合并后落到 main 的那个 commit（实测两者为同一 SHA），push 再跑一遍是 100% 冗余：
# 白花 4 分钟，还会多占一个 Unity 授权席位（席位不足会误报 no available seats）。
# 需要临时在 main 上验证时，用 workflow_dispatch 手动触发。
on:
  pull_request:
  workflow_dispatch:
  # ❗ 夜间定时打包自 2026-10-17 起暂停。
  # 原因：`build-windows` 用的 `game-ci/unity-builder@v4.4.0` 自带前置校验，只认
  # `UNITY_LICENSE`（.ulf）或 `UNITY_SERIAL`，不接受 Personal 的“邮箱+密码认领席位”。
  # 实测两次 run（08:12 与 16:11）均在步骤启动后 0.3 秒内报
  # “Missing Unity License File and no Serial was found”，根本没下载 CLI、没起容器。
  # 恢复条件：把 builder 换到带 `cliVersion` 输入的版本（v5.0.1 / v6.0.0），
  # 钉 `cliVersion: v0.1.72` 以复用测试步骤已验证的 personal 激活；验证通过后
  # 把下面的 `schedule` 加回来，并删掉 `nightly-suspended` 标记行。
  # 暂停期间仍然可以手动验证：Actions → Run workflow（`workflow_dispatch`）。
  # 原来的定时：UTC 18:00 = 北京时间次日 02:00（schedule 只在默认分支生效，cron 按 UTC）。
# nightly-suspended: 2026-10-17 unity-builder 授权失败，待升级 builder 版本后恢复定时
# （上面这行刻意写在行首：scripts/check-ci-config.sh 用它作为“主动暂停”的唯一凭证，
#   恢复定时时把 schedule 加回来并删掉这一行。）

# 全仓库共用一个组名：Unity 个人版授权是账号级“席位”，同一时刻只能有一个 Unity 进程。
# 为什么不再按 ref 分组（原来写的是 unity-tests-${{ github.ref }}）：夜间打包（schedule）
# 跑在 refs/heads/main 上，PR 测试跑在 refs/pull/N/merge 上，两者属于不同的组，会在
# 同一秒各自执行 --activate-all 抢同一个席位，输的一方拿到 “0 free entitlements” 而整轮假失败。
# 改成固定组名后，仓库内任意两个 Unity 运行都会自动排队。
# 代价（必须清楚）：GitHub 的并发组只留 1 个 running + 1 个 pending，新排队的运行会
# *取消掉更早的那个排队中的运行*——于是某个 PR 可能看到检查直接变成 cancelled，重跑即可。
# 这与原来“同一 ref 只保留一次运行”的语义一致，只是范围扩到了整个仓库。
# 刻意不设 cancel-in-progress：个人版授权是“席位”制，中途取消正在运行的 job 可能来不及归还席位
# （CLI 只在 EXIT trap 能执行完时归还），泄漏的席位会让该账号之后所有运行报 no available seats。
concurrency:
  # 必须是固定名（不含任何变量）：scripts/check-ci-config.sh 会拦住按 ref 分组的写法。
  group: unity-seat

# 为什么需要显式声明权限：仓库默认的 Workflow permissions 是「只读」，
# 而 unity-test-runner 会用 githubToken 创建 check run 来汇报测试结果（对应下面的 checkName），
# 权限不足时会直接以 ##[error]Resource not accessible by integration 让整个 job 失败，
# 表现为“测试全部通过、job 却是红的”这种假失败（PlayMode 4/4 Passed 仍失败即此原因）。
# 只声明所需的最小集合，避免把仓库全局默认改成读写。
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  unity-tests:
    name: ${{ matrix.testMode }} 测试（Unity ${{ matrix.unityVersion }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 为什么两个矩阵 job 必须串行（max-parallel: 1）：个人版授权是账号级的“席位”，
      # EditMode 与 PlayMode 同时跑会在同一秒各自执行 --activate-all 认领席位。实测 2026-10-11 09:26:39
      # 两个 job 相隔 0.06 秒完成激活，输的那个 job 在 Editor 启动时拿到
      # “Found 0 entitlement groups and 0 free entitlements matching requested entitlement ids”
      # → “No valid Unity Editor license found”，测试一条都没跑就红（代码没问题；08:52 那次相隔 2.7 秒激活，两个都绿）。
      # 串行后任一时刻只有一个 job 占席位，代价是总时长约翻倍（约 8 分钟）；
      # 想恢复并行必须给账号配浮动授权（action 的 unityLicensingServer 输入），否则会继续偶发这种假失败。
      # 顺带也消除了两个 job 同时往 actions/cache 写同一个 key 的竞争。
      max-parallel: 1
      matrix:
        # 使用 Unity 国际版，与 ProjectSettings/ProjectVersion.txt 保持一致。
        # 2022.3.62f3 是 2022.3 LTS 的最后一个版本，game-ci 官方镜像已发布对应标签
        # （unityci/editor:ubuntu-2022.3.62f3-linux-il2cpp-3），无需自建镜像。
        # 为什么必须写真实版本：Unity 遇到项目版本与编辑器版本不一致时会判定“项目由另一版本
        # 创建过”并整库重导入，写成别的版本号等于在另一个编辑器上跑绿（CI 绿、本地炸）。
        # 项目切到国际版编辑器后 ProjectVersion.txt 会变成 2022.3.62f3，与此处一致。
        unityVersion: [ '2022.3.62f3' ]
        testMode: [ EditMode, PlayMode ]
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 缓存 Library
        # 这里刻意保持 actions/cache@v4（而不用 restore/save 拆开）：实测把两个 job 拆成
        # restore 两个都做、save 只有 EditMode 做之后，PlayMode 连续两次在
        # EnterPlayMode 阶段 SIGSEGV（exit 139）。同一版本换回本写法即可通过，
        # 在查清原因之前先用这个稳妥的写法。
        # 另：拆开也并不能减少缓存占用——缓存按 ref 隔离，不同 ref 本来就各存一份。
        uses: actions/cache@v4
        with:
          path: Library
          # Library 与编辑器版本强绑定，缓存键必须带版本号：跨版本复用会出现
          # 无法解释的重导入与偶发失败。
          key: Library-${{ matrix.unityVersion }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ matrix.unityVersion }}-

      - name: 运行测试
        # 为什么固定到 v4.4.0：@v4 会跟随上游发布，而 v4.4.0 起该 action 已改成
        # game-ci/cli 的 thin wrapper，授权实现与旧版完全不同；固定版本才能在出问题时定位，
        # 也避免上游再次发生 #309 那种“同一个大版本内行为改变”的回归。升级前请先在 PR 上验证授权与测试都跑通。
        uses: game-ci/unity-test-runner@v4.4.0
        env:
          # 为什么不再提供 UNITY_LICENSE：Unity 已取消个人版（Personal）的离线手工激活，
          # .ulf 里的 MachineBindings 会把它绑死到申请它的那台机器上；hosted runner 每次都是新机器，
          # 直接加载该文件必然失败（日志表现为 Code 400 TimeStamp validation failed /
          # No ULF license found, Token not found in cache），而 CLI v0.1.72 的永久失败兜底只识别
          # "Machine bindings don't match" 这一种措辞，不会自动回退到账号激活，只会白重试 5 次（约 5 分钟）后退出。
          # 只给账号密码时，激活方式按 file → serial → floating → personal 解析为 personal，
          # CLI 会用 Unity.Licensing.Client --activate-all --include-personal 直接认领一个个人席位，与机器无关。
          # 注意：该账号不能依赖 2FA/设备验证（headless 无法应答），建议使用专用的 CI 账号。
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # 为什么还要一个 GITHUB_TOKEN 环境变量（它和下面的 githubToken 输入不是一回事）：
          # unity-test-runner v4.4.0 在解析 CLI 版本时会请求 GitHub Releases API，而该请求只读
          # process.env.GITHUB_TOKEN / GH_TOKEN（见 action 的 src/download-cli.ts）。
          # 匿名请求受共享 runner IP 的 60 次/小时限额约束，会被别的仓库流量打成 403，
          # 表现为 “Failed to resolve the latest game-ci CLI release: GitHub API returned 403.”（2026-10-11 09:41 那次失败）。
          # 注入后限额升到 5000 次/小时；配合下面固定 cliVersion，这一层只是双保险。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          unityVersion: ${{ matrix.unityVersion }}
          # 为什么固定 CLI 版本而不是用默认的 latest：latest 要先调 GitHub Releases API 把版本解析成 tag，
          # 那次匿名调用被限流就会 403，整个 job 在 25 秒内直接失败（Unity 都没启动、没有 artifacts，
          # 看起来像测试挂了，其实一步都没跑）。固定成具体 tag 后既不请求该 API，也让每次运行用的 CLI 可复现。
          # 升级前先在本 PR 上验证授权与测试都跑通（当前 game-ci/cli 最新为 v0.1.72，2026-10-03 发布）。
          cliVersion: v0.1.72
          testMode: ${{ matrix.testMode }}
          # 为什么只跑本项目自己的测试（命名空间 Spotlight.Tests）：
          # Packages/manifest.json 里以 git 地址引入的第三方包 com.besty.unity-skills 自带 1600+ 个
          # Editor 测试，其中 PerceptionSkillsTests.SceneSummarize_CountsObjectsCorrectly 依赖
          # 批处理模式下不存在的默认场景对象（Camera/Light）而必然断言失败，
          # 会把与本项目无关的红灯带到每个 PR 上（也白白多花几分钟）。
          # 注意：unity-test-runner v4.4.0 已不再暴露 testFilter 输入，
          # 只能用 customParameters 追加 Unity CLI 原生的 -testFilter 参数。
          customParameters: -testFilter Spotlight.Tests
          artifactsPath: test-results-${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} 测试结果

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.testMode }}
          path: test-results-${{ matrix.testMode }}

  # ---------------------------------------------------------------------------
  # 夜间打包：把 Windows 桌面版发布到 Release，供他人直接下载。
  # 为什么和测试放在同一个 workflow，而不是单独开一个文件：
  #   1) “测试全通过才打包”用 needs + result 判定最可靠：定时运行没有任何关联的 PR
  #      check 可查（那是 push/PR 语义），只有同一个 run 内串行，才能保证被打包的 commit
  #      就是刚刚被 EditMode + PlayMode 验过的那个 commit；
  #   2) scripts/check-ci-config.sh 要求每个 workflow 都带 pull_request 触发
  #      （缺了等于“PR 阶段不会跑这个文件”），而打包绝不该在 PR 上跑；
  #   3) 不新增文件就不会碰守卫脚本对 push 的禁令，也不会影响规则集里的三条必需检查名。
  # 已知代价：本 job 与 PR 测试共用同一个 Unity 个人版席位（账号级“席位”制），
  # 两者同时启动会在 --activate-all 上抢席位，输的一方报 no available seats 假失败。
  # 已通过顶层的 concurrency.group: unity-seat 把整个仓库的 Unity 运行串成一列来避免重叠；
  # 彻底解决（不排队、真并发）仍需浮动授权（unityLicensingServer）或 self-hosted runner。
  # ---------------------------------------------------------------------------
  build-windows:
    # ⚠️ job id 是 scripts/check-ci-config.sh 按字符串校验的对象（它检查 needs 与成功判定），
    # 改名必须同步改脚本，否则守卫会报“缺少 build-windows job”。
    # name 刻意不复用测试矩阵的 job 名，避免与规则集里的必需检查名混淆。
    name: 打包 Windows 夜间版（Unity 2022.3.62f3）
    needs: unity-tests
    # 两道门：测试矩阵（EditMode + PlayMode）全部成功，且必须是定时或手动触发。
    # 不使用 always()：needs 失败时本 job 应直接跳过，而不是拿着红着的代码去发布。
    # 这一行必须写成单行——守卫脚本按单行片段匹配，写成折叠式会报错（故意的）。
    if: needs.unity-tests.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # 只有本 job 需要写权限（创建 Release、上传资产）；workflow 级仍是只读，
    # 避免把写权限扩散给测试 job。仓库默认 Workflow permissions 是「只读」，
    # 不声明会得到 403 Resource not accessible by integration。
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 必须拉真实 LFS 内容：Spotlight.xlsx / SimHei.ttf / SimHei TextCore.asset 都是 LFS 指针，
          # 而 ConfigBuildProcessor 会比对工作簿 SHA256 与编译清单，拿到指针文件必然报
          # “配置门禁阻止构建”（看起来像构建脚本坏了，其实是 checkout 少了 LFS）。
          lfs: true
          # 完整历史：game-ci 需要 git 信息来定位版本，也便于事后确认“这次打的是哪个提交”。
          fetch-depth: 0

      - name: 缓存 Library
        # key 与测试矩阵里的完全一致（矩阵只有一个 unityVersion），因此本 job 能直接复用
        # 同一提交下测试刚写好的 Library，省掉一次全量导入。
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-2022.3.62f3-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-2022.3.62f3-

      - name: 打包 Windows 64 位版本
        # 与测试固定同一版本，理由见测试步骤上的注释（@v4 会跟随上游改变授权实现）。
        uses: game-ci/unity-builder@v4.4.0
        env:
          # 个人版授权按邮箱+密码在当前机器上认领席位（不打 .ulf），与测试同源。
          # Windows 目标还会额外校验这两个变量存在，缺失时直接拒绝构建。
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # 同测试步骤：game-ci CLI 解析版本会请求 GitHub Releases API，
          # 匿名请求受共享 runner IP 的 60 次/小时限额约束，会被打成 403。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          unityVersion: '2022.3.62f3'
          targetPlatform: StandaloneWindows64
          # 用 builder 内置构建脚本：场景取自 EditorBuildSettings（与 BuildEntry 同一份），
          # 产物固定落在 build/StandaloneWindows64/。没有写 buildMethod 指向
          # BuildEntry.BuildWindows，是因为后者的输出目录是工程根下的 Build/，会让 artifact
          # 路径与 builder 的约定分叉；两条路径都经过同一个 ConfigBuildProcessor 门禁，
          # 配置校验一步都不会跳过。
          # 项目是 Mono 后端（ProjectSettings.scriptingBackend 为空），ubuntu runner 可交叉编译
          # Windows 包；若将来改成 IL2CPP，这里必须换成 Windows 镜像/runner。
          versioning: None
          # 关掉自动版本号的原因：仓库没有任何 tag，Semantic 策略只能推出 0.0.<提交数>，
          # 且会在构建期改写 PlayerSettings.bundleVersion；一旦被 Unity 落盘就会让
          # builder 判定为 dirty build 而失败。版本信息改由 Release 说明里的 commit 承担。

      - name: 压缩构建产物
        # Release 资产必须是单个文件：exe 只有和同目录的 _Data、UnityPlayer.dll、
        # MonoBleedingEdge 放在一起才可运行。
        run: |
          ls -la build/StandaloneWindows64
          cd build/StandaloneWindows64
          zip -r "$GITHUB_WORKSPACE/spotlight2026-windows-nightly.zip" .

      - name: 上传构建产物
        # 即使后面发布 Release 失败（例如 token 权限被收紧），也能在 Actions 页面手动取包排查。
        uses: actions/upload-artifact@v4
        with:
          name: spotlight2026-windows-nightly
          path: spotlight2026-windows-nightly.zip

      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "自动打包产物，来自提交 \`${GITHUB_SHA}\`（${{ github.event_name }} 触发）。"
            echo
            echo "- 前置条件：本次运行的 EditMode + PlayMode 测试全部通过后才开始打包"
            echo "- 构建记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- 使用方式：解压 spotlight2026-windows-nightly.zip 后运行 2026spotligt.exe"
            echo "- 正式包（BuildOptions.None），不含调试配置面板"
          } > release-notes.md
          # 固定用同一个 nightly 标签 + --clobber 覆盖资产：外部只需要一个不变的下载链接，
          # 也避免每天新增一个 tag 把 Release 列表撑爆。--prerelease 保证它不会被标成 latest。
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly spotlight2026-windows-nightly.zip --clobber
            gh release edit nightly --notes-file release-notes.md
          else
            gh release create nightly spotlight2026-windows-nightly.zip \
              --prerelease --title "夜间构建（nightly）" --notes-file release-notes.md
          fi
