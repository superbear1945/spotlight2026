# PR 测试流水线：在 GitHub Action 中运行 Unity EditMode 与 PlayMode 测试。
# 为什么需要：AGENTS.md 要求每个功能都留下可在 PR 上自动执行的测试；
# 规则内核与配置编译器不依赖场景，用 EditMode 即可覆盖；
# 而棋盘渲染、点击落点与 DOTween 动效只有在真实帧循环（PlayMode）里才能验证，
# 因此两种模式都要在流水线上跑，避免“日志说移动了、界面却没动”这类问题再次漏过。
name: Unity Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  workflow_dispatch:

# 同一 ref 只保留一次运行：反复推修复时避免多个运行叠在一起（实测同时跑了 3 个），
# 白白消耗 CI 时间，也让“哪次失败对应哪个 commit”变得难查。
# 刻意不设 cancel-in-progress：个人版授权是“席位”制，中途取消正在运行的 job 可能来不及归还席位
# （CLI 只在 EXIT trap 能执行完时归还），泄漏的席位会让该账号之后所有运行报 no available seats。
# 默认行为只会取消“排队中”的旧运行，正在执行的那次不受影响。
concurrency:
  group: unity-tests-${{ github.ref }}

# 为什么需要显式声明权限：仓库默认的 Workflow permissions 是「只读」，
# 而 unity-test-runner 会用 githubToken 创建 check run 来汇报测试结果（对应下面的 checkName），
# 权限不足时会直接以 ##[error]Resource not accessible by integration 让整个 job 失败，
# 表现为“测试全部通过、job 却是红的”这种假失败（PlayMode 4/4 Passed 仍失败即此原因）。
# 只声明所需的最小集合，避免把仓库全局默认改成读写。
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  unity-tests:
    name: ${{ matrix.testMode }} 测试（Unity ${{ matrix.unityVersion }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 必须与 ProjectSettings/ProjectVersion.txt 完全一致，含中国版后缀。
        # 为什么不再写 '2022.3.62f1'：那是国际版版本号。Unity 遇到项目版本与编辑器版本
        # 不一致时会判定“项目由另一版本创建过”并整库重导入，于是出现“CI 绿、本地炸”——
        # CI 通过只代表通过在国际版上，没验证过开发实际使用的中国版。
        unityVersion: [ '2022.3.62f3c1' ]
        testMode: [ EditMode, PlayMode ]
    env:
      # 中国版编辑器镜像地址，从仓库 Variables 读取（Settings → Secrets and variables
      # → Actions → Variables，变量名 UNITY_CHINA_IMAGE）。
      # 为什么需要单独一个变量：Unity 中国版（版本号带 c1 后缀）不在 Unity 国际版发行源里，
      # game-ci 的 unityci/editor 因此不会发布 ubuntu-2022.3.62f3c1-* 标签，
      # 必须自建镜像；把地址放 Variables 后，切换镜像不需要再改本文件。
      # 留空时下面的前置检查会提前给出中文指引，而不是抛一句 manifest unknown。
      UNITY_IMAGE: ${{ vars.UNITY_CHINA_IMAGE }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 前置检查中国版编辑器镜像
        # 为什么需要：官方 unityci/editor 不发布中国版标签，直接跑会在 docker pull 阶段失败，
        # 日志只有“manifest unknown”，看不出该做什么。这里提前几秒给出结论与自建方式。
        if: ${{ env.UNITY_IMAGE == '' }}
        run: |
          echo "::error::未配置中国版编辑器镜像（仓库 Variables 的 UNITY_CHINA_IMAGE 为空）"
          echo "2022.3.62f3c1 是 Unity 中国版，不在 Unity 国际版发行源里（国际 API 查该版本返回 0 条），"
          echo "game-ci 官方镜像不会发布对应标签，因此必须自建并推送到一个可拉取的仓库，例如："
          echo "  ghcr.io/<组织>/unity-china:2022.3.62f3c1"
          echo "自建所需文件（revision 与 ProjectVersion.txt 的 1623fc0bbb97 一致）："
          echo "  编辑器     https://download.unitychina.cn/download_unity/1623fc0bbb97/LinuxEditorInstaller/Unity-2022.3.62f3c1.tar.xz"
          echo "  IL2CPP模块 https://download.unitychina.cn/download_unity/1623fc0bbb97/LinuxEditorTargetInstaller/UnitySetup-Linux-IL2CPP-Support-for-Editor-2022.3.62f3c1.tar.xz"
          echo "镜像就绪后，把地址写入 Variables: UNITY_CHINA_IMAGE，本文件无需改动。"
          exit 1

      - name: 缓存 Library
        uses: actions/cache@v4
        with:
          path: Library
          # Library 与编辑器版本强绑定，缓存键必须带上镜像地址：换成中国版镜像后
          # 若复用国际版构建的 Library，会出现无法解释的重导入与偶发失败。
          key: Library-${{ matrix.unityVersion }}-${{ env.UNITY_IMAGE || 'official' }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ matrix.unityVersion }}-${{ env.UNITY_IMAGE || 'official' }}-

      - name: 运行测试
        # 为什么固定到 v4.4.0：@v4 会跟随上游发布，而 v4.4.0 起该 action 已改成
        # game-ci/cli 的 thin wrapper，授权实现与旧版完全不同；固定版本才能在出问题时定位，
        # 也避免上游再次发生 #309 那种“同一个大版本内行为改变”的回归。升级前请先在 PR 上验证授权与测试都跑通。
        uses: game-ci/unity-test-runner@v4.4.0
        env:
          # 为什么不再提供 UNITY_LICENSE：Unity 已取消个人版（Personal）的离线手工激活，
          # .ulf 里的 MachineBindings 会把它绑死到申请它的那台机器上；hosted runner 每次都是新机器，
          # 直接加载该文件必然失败（日志表现为 Code 400 TimeStamp validation failed /
          # No ULF license found, Token not found in cache），而 CLI v0.1.72 的永久失败兜底只识别
          # "Machine bindings don't match" 这一种措辞，不会自动回退到账号激活，只会白重试 5 次（约 5 分钟）后退出。
          # 只给账号密码时，激活方式按 file → serial → floating → personal 解析为 personal，
          # CLI 会用 Unity.Licensing.Client --activate-all --include-personal 直接认领一个个人席位，与机器无关。
          # 注意：该账号不能依赖 2FA/设备验证（headless 无法应答），建议使用专用的 CI 账号。
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ matrix.unityVersion }}
          # 指向自建的中国版镜像；为空时退回 game-ci 官方镜像（已被上面的前置检查拦住）。
          customImage: ${{ env.UNITY_IMAGE }}
          testMode: ${{ matrix.testMode }}
          # 为什么只跑本项目自己的测试（命名空间 Spotlight.Tests）：
          # Packages/manifest.json 里以 git 地址引入的第三方包 com.besty.unity-skills 自带 1600+ 个
          # Editor 测试，其中 PerceptionSkillsTests.SceneSummarize_CountsObjectsCorrectly 依赖
          # 批处理模式下不存在的默认场景对象（Camera/Light）而必然断言失败，
          # 会把与本项目无关的红灯带到每个 PR 上（也白白多花几分钟）。
          # 注意：unity-test-runner v4.4.0 已不再暴露 testFilter 输入，
          # 只能用 customParameters 追加 Unity CLI 原生的 -testFilter 参数。
          customParameters: -testFilter Spotlight.Tests
          artifactsPath: test-results-${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} 测试结果

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.testMode }}
          path: test-results-${{ matrix.testMode }}
